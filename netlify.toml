# Netlify settings for Vesta (Next.js 16). Netlify adds its Next.js adapter on its own.
#
# Secrets are not kept here: set OPENROUTER_API_KEY in Netlify's site settings
# (Site configuration > Environment variables), for the Functions scope.

[build]
  # Netlify detects Bun from the older bun.lockb file, not the newer bun.lock this project uses,
  # so it may install with npm first. This installs exactly the versions in bun.lock either way.
  command = "bun install --frozen-lockfile && bun run build"
  publish = ".next"

[build.environment]
  # The same versions as development.
  BUN_VERSION = "1.3.14"
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[functions]
  # Ask AI and the Compare explanation (they call OpenRouter; each answer stops by 25 seconds).
  directory = "netlify/functions"
